name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Release publishes should not reuse a dependency cache.
          package-manager-cache: false

      # setup-node writes an empty //registry...:_authToken= line and also
      # injects NODE_AUTH_TOKEN into the job env. Both force token auth and
      # break OIDC trusted publishing / provenance.
      - name: Prepare npm for OIDC trusted publishing
        run: |
          sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "npm $(npm --version)"
          echo "node $(node --version)"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Publish to npm
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicitly clear token auth so npm uses OIDC instead.
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
