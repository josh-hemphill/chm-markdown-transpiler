name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Release publishes should not reuse a dependency cache.
          package-manager-cache: false

      # Trusted publishing needs a recent npm CLI (OIDC exchange).
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@latest

      # setup-node writes an empty //registry...:_authToken= line when
      # registry-url is set; that forces token auth and breaks OIDC.
      - name: Remove setup-node authToken for OIDC
        run: sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Publish to npm
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Do not set NPM_TOKEN / NODE_AUTH_TOKEN — OIDC trusted publishing.
